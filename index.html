<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #050508; color: #e2e8f0;
      overflow-x: hidden; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    .container { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
    
    /* Шапка сайта */
    .header {
      padding: 20px 30px; background: rgba(13, 13, 20, 0.85); border-radius: 16px; margin-bottom: 25px;
      border: 1px solid #1f1235; box-shadow: 0 0 20px rgba(138, 43, 226, 0.15);
      display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px);
    }
    .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(138, 43, 226, 0.8); }
    .balance-box { background-color: #050508; padding: 12px 24px; border-radius: 10px; border: 1px solid #8a2be2; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4); }

    .card { background-color: rgba(13, 13, 20, 0.85); padding: 25px; border-radius: 16px; border: 1px solid #1f1235; text-align: center; margin-bottom: 20px; }
    
    /* 🎬 ГОРИЗОНТАЛЬНАЯ РУЛЕТКА В СТИЛЕ CS */
    .roulette-container {
      position: relative; width: 100%; background: #0b0818;
      border: 3px solid #8a2be2; border-radius: 14px;
      margin-bottom: 25px; overflow: hidden; display: none;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.4) inset;
      height: 145px;
    }
    /* Вертикальная стрелка (прицел) по центру */
    .roulette-pointer {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 4px; height: 100%; background-color: #f1c40f;
      z-index: 10; box-shadow: 0 0 15px #f1c40f;
    }
    /* Затемнение по бокам как в CS */
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 120px; height: 100%; background: linear-gradient(to right, #0b0818, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 120px; height: 100%; background: linear-gradient(to left, #0b0818, transparent); z-index: 5; }
    
    .roulette-wrapper { display: flex; width: max-content; padding: 12px 0; }
    
    /* Карточка оружия внутри рулетки */
    .roulette-item {
      width: 170px; height: 115px; background: linear-gradient(to bottom, #110d24, #080612);
      border: 1px solid #23184a; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex-shrink: 0; box-sizing: border-box; padding: 5px;
      border-bottom: 5px solid #fff;
    }
    .roulette-item svg { width: 120px; height: auto; margin-bottom: 5px; }
    .roulette-item span { font-size: 0.75rem; font-weight: bold; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    /* Показ финального выигрыша */
    .win-announce { text-align: center; font-size: 1.8rem; font-weight: bold; margin: 15px 0; display: none; }

    /* Дизайн главного кейса */
    .case-card-huge { background: linear-gradient(135deg, #100a26, #05030f); border: 2px solid #8a2be2; box-shadow: 0 0 30px rgba(138, 43, 226, 0.5); border-radius: 16px; padding: 35px; margin: 0 auto; max-width: 450px; }
    .weapon-preview-container { width: 100%; height: 120px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
    .weapon-preview-svg { width: 100%; max-width: 280px; height: auto; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
    .case-price-tag { font-size: 1.6rem; color: #f39c12; font-weight: bold; margin: 15px 0; text-shadow: 0 0 10px rgba(243,156,18,0.5); }

    .btn-primary { background-color: #8a2be2 !important; color: #fff !important; border: none; padding: 16px 32px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.2rem; box-shadow: 0 0 15px rgba(138,43,226,0.4); transition: background-color 0.2s; }
    .btn-primary:hover { background-color: #9d4edd !important; box-shadow: 0 0 25px rgba(138, 43, 226, 0.8) !important; }
    .btn-primary:disabled { background-color: #332255 !important; color: #888 !important; cursor: not-allowed; box-shadow: none; }

    /* Склад под кейсом */
    .inventory-box { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
    .inv-item { background: #0d0d14; border: 1px solid #2d1b4e; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
  </style>
</head>
<body>

<!-- ВЕКТОРНЫЙ ЧЕРТЕЖ ПОЛНОЙ МОДЕЛИ MK14 (НЕ ОБРЕЗАН) -->
<svg style="display: none;">
  <g id="mk14-gun">
    <path d="M 10 25 L 55 25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="10" y="23" width="6" height="4" fill="currentColor" rx="1"/>
    <path d="M 18 23 L 20 16 L 24 23 Z" fill="currentColor"/>
    <path d="M 28 25 L 26 38 L 22 38 M 28 25 L 30 38 L 34 38" stroke="currentColor" stroke-width="1.8" fill="none"/>
    <rect x="45" y="20" width="65" height="9" fill="#131317" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 110 17 L 160 17 L 156 31 L 110 31 Z" fill="#18181f" stroke="currentColor" stroke-width="2"/>
    <path d="M 130 17 L 133 11 L 140 11" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 152 30 L 142 48 C 140 51, 148 53, 150 50 L 159 30 Z" fill="#101014" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 120 31 L 115 52 C 114 54, 126 55, 128 52 L 132 31 Z" fill="#1a1a22" stroke="currentColor" stroke-width="1.8"/>
    <path d="M 137 31 C 137 37, 145 37, 145 31" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <path d="M 158 23 L 190 23 L 190 17 L 200 17 L 200 41 L 190 42 L 190 31 L 158 31" stroke="currentColor" stroke-width="2" fill="none"/>
  </g>
</svg>

<div class="container">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="header">
    <h1 class="logo-title">METROUP</h1>
    <div class="balance-box">
      <span>Ваш Баланс:</span>
      <span id="balance-val" style="color: #f39c12;">500</span>
      <span style="color: #f39c12;">💰</span>
    </div>
  </header>

  <!-- ОКНО ГОРИЗОНТАЛЬНОЙ РУЛЕТКИ -->
  <div class="roulette-container" id="roulette-box">
    <div class="roulette-pointer"></div>
    <div class="roulette-wrapper" id="roulette-roll"></div>
  </div>

  <!-- ТЕКСТ ВЫИГРЫША -->
  <div class="win-announce" id="win-text"></div>

  <!-- ГЛАВНЫЙ КЕЙС -->
  <div class="case-card-huge">
    <div class="weapon-preview-container">
      <svg class="weapon-preview-svg" viewBox="0 0 205 60" style="color: #8a2be2;">
        <use href="#mk14-gun" />
      </svg>
    </div>
    <h3 style="text-align: center; font-size: 1.4rem; margin: 0;">Оружейный Ящик MK14</h3>
    <p class="case-price-tag" style="text-align: center;">250 Монет 💰</p>
    <button class="btn-primary" id="open-btn" onclick="openMk14Case()">Открыть кейс</button>
  </div>

  <!-- СКЛАД ПОД КЕЙСОМ -->
  <div class="card" style="margin-top: 25px;">
    <h3 style="margin-top: 0;">🎒 Мой Склад Оружия</h3>
    <div class="inventory-box" id="inventory-root">
      <span style="color:#64748b;">Здесь будет отображаться ваше выбитое оружие...</span>
    </div>
  </div>
</div>

<script>
  let localCoins = parseInt(localStorage.getItem('metro_coins_final')) || 500;
  document.getElementById('balance-val').innerText = localCoins;

  // 6 редкостей по вашему ТЗ с RTP 98%
  const mk14LootTable = [
    { name: 'Повреждённая MK14', color: '#95a5a6', shadow: 'rgba(149,165,166,0.5)', chance: 45.0 },
    { name: 'Отремонтированная MK14', color: '#2ecc71', shadow: 'rgba(46,204,113,0.5)', chance: 28.0 },
    { name: 'Целая MK14', color: '#3498db', shadow: 'rgba(52,152,219,0.5)', chance: 15.0 },
    { name: 'Улучшенная MK14', color: '#9b59b6', shadow: 'rgba(155,89,182,0.5)', chance: 8.0 },
    { name: 'Высшего качества MK14', color: '#ff7675', shadow: 'rgba(255,118,117,0.5)', chance: 3.2 },
    { name: 'Золотая MK14', color: '#f1c40f', shadow: 'rgba(241,196,15,0.6)', chance: 0.8 }
  ];

  let playerInventory = JSON.parse(localStorage.getItem('player_items_final')) || [];

  function renderInventory() {
    const root = document.getElementById('inventory-root');
    if (playerInventory.length === 0) return;
    root.innerHTML = '';
    playerInventory.forEach(item => {
      const div = document.createElement('div');
      div.className = 'inv-item'; div.style.borderColor = item.color; div.style.color = item.color;
      div.style.boxShadow = `0 0 8px ${item.shadow}`; div.innerText = item.name;
      root.appendChild(div);
    });
  }
  renderInventory();

  function generateCarouselItems(winnerItem) {
    const wrapper = document.getElementById('roulette-roll');
    wrapper.innerHTML = '';
    wrapper.style.transition = 'none';
    wrapper.style.transform = 'translateX(0px)';

    // Генерируем 50 пушек в ленту. Победитель встанет строго на 38 место
    for (let i = 0; i < 50; i++) {
      let item = (i === 38) ? winnerItem : mk14LootTable[Math.floor(Math.random() * mk14LootTable.length)];
      const div = document.createElement('div');
      div.className = 'roulette-item';
      div.style.borderBottomColor = item.color;
      div.style.color = item.color;
      div.innerHTML = `
        <svg viewBox="0 0 205 60" style="color: ${item.color};"><use href="#mk14-gun" /></svg>
        <span>${item.name}</span>
      `;
      wrapper.appendChild(div);
    }
  }

  function openMk14Case() {
    const price = 250;
    if (localCoins < price) { alert('Недостаточно монет! Подождите начисления (+5 монет каждую минуту).'); return; }
