<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP :: Симулятор Кейсов MK14</title>
  <style>
    /* Базовые стили в золотом и тёмно-сером тонах Case-Battle */
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #161a23; color: #e2e8f0; overflow-x: hidden; min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
    
    /* Шапка сайта */
    .header {
      background: #1f2432; padding: 20px 30px; border-radius: 12px; margin-bottom: 25px;
      border: 1px solid #2d3446; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #f6a45a; text-shadow: 0 0 10px rgba(246,164,90,0.3); }
    
    .balance-box { 
      background-color: #161a23; padding: 12px 24px; border-radius: 8px; 
      border: 1px solid #b0681e; font-weight: bold; font-size: 1.2rem; 
      display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(176,104,30,0.2);
    }

    /* Главная сетка */
    .main-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card { background-color: #1f2432; padding: 25px; border-radius: 12px; border: 1px solid #2d3446; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    /* Стили главного кейса */
    .case-card-huge { text-align: center; width: 100%; }
    .weapon-preview-container { width: 100%; height: 110px; margin: 15px auto; display: flex; align-items: center; justify-content: center; }
    .weapon-svg { width: 260px; height: auto; display: block; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    .price-tag { font-size: 1.7rem; color: #f6a45a; font-weight: bold; margin: 15px 0; }

    /* Витрина содержимого */
    .case-contains-title { font-size: 1.2rem; font-weight: bold; margin-top: 35px; margin-bottom: 15px; text-align: left; border-bottom: 1px solid #2d3446; padding-bottom: 8px; color: #f6a45a; }
    .contains-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .contains-item { background: #161a23; border: 1px solid #2d3446; border-radius: 8px; padding: 12px 6px; font-size: 0.75rem; text-align: center; font-weight: bold; border-bottom: 4px solid #fff; }
    .contains-item svg { width: 100px; height: auto; margin-bottom: 8px; }

    /* 🎬 ГОРИЗОНТАЛЬНАЯ РУЛЕТКА CS:GO */
    .roulette-container {
      position: relative; width: 100%; background: #0e1219; border: 2px solid #b0681e; border-radius: 12px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 145px; box-shadow: 0 0 25px rgba(176,104,30,0.3) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #f6a45a; z-index: 10; box-shadow: 0 0 15px #f6a45a; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 140px; height: 100%; background: linear-gradient(to right, #0e1219, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 140px; height: 100%; background: linear-gradient(to left, #0e1219, transparent); z-index: 5; }
    .roulette-wrapper { display: flex; width: max-content; padding: 12px 0; transform: translateX(0px); }
    
    .roulette-item {
      width: 170px; height: 115px; background: linear-gradient(to bottom, #1f2432, #161a23); border: 1px solid #2d3446; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item svg { width: 110px; height: auto; margin-bottom: 8px; }
    .roulette-item span { font-size: 0.72rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

    /* Поп-ап решения */
    .drop-action-popup {
      background: #161a23; border: 2px solid #f6a45a; border-radius: 12px; padding: 25px;
      text-align: center; margin: 0 auto 25px auto; max-width: 450px; display: none;
      box-shadow: 0 0 35px rgba(176,104,30,0.5); animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupShow { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn-sell { background: #d9534f !important; color: #fff !important; }
    .btn-sell:hover { box-shadow: 0 0 15px rgba(217,83,79,0.4); }

    /* Инвентарь */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px; max-height: 320px; overflow-y: auto; }
    .inv-card {
      background: #161a23; border: 2px solid #2d3446; border-radius: 10px; padding: 12px 8px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card svg { width: 100px; height: auto; margin: 5px auto; }
    .inv-card .sell-price { color: #f6a45a; font-weight: bold; font-size: 0.9rem; margin: 6px 0; }

    /* Таблица топа */
    .leaderboard-list { list-style: none; padding: 0; margin: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #2d3446; font-size: 0.95rem; }
    .leaderboard-item.top-1 { color: #f6a45a; font-weight: bold; }

    .btn-primary { background: linear-gradient(to bottom, #f6a45a, #b0681e) !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
    .btn-primary:disabled { background: #2d3446 !important; color: #555 !important; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<!-- ВЕКТОРНЫЙ SVG ШАБЛОН ДЛИННОЙ ВИНТОВКИ MK14 (АВТОНОМНЫЙ, НЕ ТРЕБУЕТ СЕРВЕРОВ) -->
<svg style="display: none;">
  <g id="svg-mk14-core">
    <path d="M 5 25 L 55 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <rect x="5" y="23" width="6" height="4" fill="currentColor" rx="1"/>
    <path d="M 14 23 L 16 16 L 20 23 Z" fill="currentColor"/>
    <path d="M 24 25 L 22 38 L 18 38 M 24 25 L 26 38 L 30 38" stroke="currentColor" stroke-width="2" fill="none"/>
    <rect x="42" y="20" width="70" height="10" fill="#111" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 112 17 L 165 17 L 160 32 L 112 31 Z" fill="#1a1a1a" stroke="currentColor" stroke-width="2"/>
    <path d="M 132 17 L 135 11 L 142 11" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 154 30 L 144 48 C 142 51, 150 53, 152 50 L 161 30 Z" fill="#111" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 122 31 L 117 52 C 116 54, 128 55, 130 52 L 134 31 Z" fill="#222" stroke="currentColor" stroke-width="1.8"/>
    <path d="M 140 31 C 140 37, 148 37, 145 31" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <path d="M 160 23 L 195 23 L 195 17 L 205 17 L 205 41 L 195 42 L 195 31 L 160 31" stroke="currentColor" stroke-width="2" fill="none"/>
  </g>
</svg>

<div class="container">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="header">
    <div class="logo-area">
      <h1 class="logo-title">METROUP</h1>
    </div>
    <div class="balance-box">
      <span>Баланс:</span>
      <span id="balance-val" style="color: #f6a45a;">500</span>
      <span style="color: #f6a45a;">💰</span>
    </div>
  </header>

  <!-- 🎬 ОКНО ГОРИЗОНТАЛЬНОЙ РУЛЕТКИ (CS STYLE) -->
  <div class="roulette-container" id="roulette-box">
    <div class="roulette-pointer"></div>
    <div class="roulette-wrapper" id="roulette-roll"></div>
  </div>

  <!-- ОКНО ВЫПАВШЕГО ДРОПА -->
  <div class="drop-action-popup" id="popup-box">
    <h3 style="margin-top:0; color:#fff;">🎉 ПРЕДМЕТ ПОЛУЧЕН:</h3>
    <div id="popup-item-name" style="font-size:1.6rem; font-weight:bold; margin:15px 0;"></div>
    <div class="popup-buttons">
      <button class="btn-primary" onclick="closePopupAndKeep()">🎒 В инвентарь</button>
      <button class="btn-primary btn-sell" id="popup-sell-btn">💰 Продать скин</button>
    </div>
  </div>

  <!-- ГЛАВНЫЙ ИНТЕРФЕЙС ИГРЫ -->
  <div class="main-grid">
    
    <!-- ЛЕВАЯ КОЛОНКА -->
    <div class="left-column">
      <div class="card">
        <div class="case-card-huge">
          <div class="weapon-preview-container">
            <svg class="weapon-svg" viewBox="0 0 210 60" style="color: #8a2be2;"><use href="#svg-mk14-core" /></svg>
          </div>
          <h2>Контейнер Снабжения MK14</h2>
          <p style="color:#94a3b8; font-size:0.95rem; margin-bottom:15px;">6 модификаций качества Metro Royale. Честный возврат (RTP) равен 98%.</p>
          <div class="price-tag">250 Монет 💰</div>
          <button class="btn-primary" id="open-btn" onclick="startCS2RouletteAnimation()">ОТКРЫТЬ КЕЙС</button>
        </div>

        <div class="case-contains-title">Содержимое контейнера:</div>
        <div class="contains-grid">
          <div class="contains-item" style="border-bottom-color: #f1c40f; color:#f1c40f;"><svg viewBox="0 0 210 60"><use href="#svg-mk14-core"/></svg><div>Золотая MK14</div></div>
          <div class="contains-item" style="border-bottom-color: #ff7675; color:#ff7675;"><svg viewBox="0 0 210 60"><use href="#svg-mk14-core"/></svg><div>Высшего качества</div></div>
