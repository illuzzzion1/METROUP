<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP - Кейс MK14</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #050508; color: #e2e8f0;
      overflow-x: hidden; min-height: 100vh;
    }
    .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .neon-line { position: absolute; width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2, 0 0 5px #fff; opacity: 0.3; transform: rotate(45deg); animation: drop linear infinite; }
    .line-1 { left: 15%; animation-duration: 6s; } .line-2 { left: 45%; animation-duration: 9s; } .line-3 { left: 75%; animation-duration: 7s; } .line-4 { left: 90%; animation-duration: 11s; }
    @keyframes drop { 0% { top: -200px; } 100% { top: 100%; } }
    
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    
    /* Шапка сайта */
    .header {
      padding: 20px 30px; background: rgba(13, 13, 20, 0.85); border-radius: 16px; margin-bottom: 25px;
      border: 1px solid #1f1235; box-shadow: 0 0 20px rgba(138, 43, 226, 0.15);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
      backdrop-filter: blur(5px);
    }
    .logo-title { margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(138, 43, 226, 0.8); }
    .balance-box { 
      background-color: #050508; padding: 12px 24px; border-radius: 10px; 
      border: 1px solid #8a2be2; font-weight: bold; font-size: 1.2rem; 
      display: flex; align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    .main-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card { background-color: rgba(13, 13, 20, 0.85); padding: 25px; border-radius: 16px; border: 1px solid #1f1235; margin-bottom: 20px; }
    
    /* ОГРОМНЫЙ КЕЙС С ВИНТОВКОЙ */
    .case-card-huge { 
      background: linear-gradient(135deg, #100a26, #05030f); 
      border: 2px solid #8a2be2; box-shadow: 0 0 30px rgba(138, 43, 226, 0.5); 
      border-radius: 16px; padding: 30px; text-align: center; margin: 0 auto; width: 100%; box-sizing: border-box;
    }
    
    .weapon-preview-container {
      width: 100%; height: 120px; margin: 15px auto; display: flex; align-items: center; justify-content: center;
    }
    .weapon-preview-svg {
      width: 100%; max-width: 290px; height: auto; display: block;
      animation: float 3s infinite ease-in-out;
    }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
    .case-price-tag { font-size: 1.7rem; color: #f39c12; font-weight: bold; margin: 15px 0; text-shadow: 0 0 10px rgba(243,156,18,0.5); }

    /* 🎬 НАСТОЯЩАЯ ГОРИЗОНТАЛЬНАЯ РУЛЕТКА В СТИЛЕ CS:GO */
    .roulette-container {
      position: relative; width: 100%; background: #070510;
      border: 3px solid #8a2be2; border-radius: 14px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 145px;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.4) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #f1c40f; z-index: 10; box-shadow: 0 0 15px #f1c40f; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 140px; height: 100%; background: linear-gradient(to right, #070510, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 140px; height: 100%; background: linear-gradient(to left, #070510, transparent); z-index: 5; }
    .roulette-wrapper { display: flex; width: max-content; padding: 12px 0; }
    
    .roulette-item {
      width: 160px; height: 115px; background: linear-gradient(to bottom, #110d24, #080612); border: 1px solid #1f1235; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item svg { width: 110px; height: auto; margin-bottom: 8px; }
    .roulette-item span { font-size: 0.72rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

    /* Окно быстрого решения (Продать/Забрать) */
    .drop-action-popup {
      background: #0d0d14; border: 2px solid #8a2be2; border-radius: 12px; padding: 25px;
      text-align: center; margin-bottom: 25px; width: 100%; box-sizing: border-box; display: none;
      box-shadow: 0 0 35px rgba(138, 43, 226, 0.5);
      animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupShow { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn-sell { background-color: #e74c3c !important; color: #fff !important; }
    .btn-sell:hover { background-color: #c0392b !important; box-shadow: 0 0 15px rgba(231,76,60,0.5); }

    /* Склад инвентаря */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; margin-top: 15px; max-height: 320px; overflow-y: auto; }
    .inv-card {
      background: #0d0d14; border: 2px solid #1f1235; border-radius: 10px; padding: 12px 8px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card svg { width: 100px; height: auto; margin: 5px auto; }
    .inv-card .sell-price { color: #f39c12; font-weight: bold; font-size: 0.9rem; margin: 6px 0; }

    .leaderboard-list { list-style: none; padding: 0; margin: 15px 0 0 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #1f1235; font-size: 0.95rem; }
    .leaderboard-item:last-child { border-bottom: none; }
    .leaderboard-item.top-1 { color: #f1c40f; font-weight: bold; }

    .btn-primary { background-color: #8a2be2 !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; transition: background-color 0.2s; box-shadow: 0 0 15px rgba(138,43,226,0.3); }
    .btn-primary:hover { background-color: #9d4edd !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8) !important; }
    .btn-primary:disabled { background-color: #332255 !important; color: #888 !important; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<div class="bg-lines"><div class="neon-line line-1"></div><div class="neon-line line-2"></div><div class="neon-line line-3"></div><div class="neon-line line-4"></div></div>

<div class="container">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="header">
    <h1 class="logo-title">METROUP</h1>
    <div class="balance-box">
      <span>Ваш Баланс:</span>
      <span id="balance-val" style="color: #f39c12;">500</span>
      <span style="color: #f39c12;">💰</span>
    </div>
  </header>

  <!-- ЛЕНТА РУЛЕТКИ (CS STYLE) -->
  <div class="roulette-container" id="roulette-box">
    <div class="roulette-pointer"></div>
    <div class="roulette-wrapper" id="roulette-roll"></div>

  <!-- ОКНО РЕШЕНИЯ ДРОПА -->
  <div class="drop-action-popup" id="popup-box">
    <h3 style="margin-top:0; color:#fff;">🎁 ПРЕДМЕТ ПОЛУЧЕН:</h3>
    <div id="popup-item-name" style="font-size:1.6rem; font-weight:bold; margin:15px 0;"></div>
    <div class="popup-buttons">
      <button class="btn-primary" onclick="closePopupAndKeep()">🎒 Убрать на Склад</button>
      <button class="btn-primary btn-sell" id="popup-sell-btn">💰 Продать скин</button>
    </div>
  </div>

  <!-- ГЛАВНАЯ СЕТКА САЙТА -->
  <div class="main-grid">
    
    <!-- ЛЕВАЯ КОЛОНКА: ИГРОВОЙ КЕЙС -->
    <div class="left-column">
      <div class="case-card-huge">
        <div class="weapon-preview-container">
          <svg class="weapon-preview-svg" viewBox="0 0 205 60" style="color: #8a2be2;"><use href="#mk14-gun-blueprint" /></svg>
        </div>
        <h3 style="font-size: 1.5rem; margin: 0 0 10px 0;">Контейнер Снабжения MK14</h3>
