<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP :: Фиолетовый Неон</title>
  <style>
    /* Глубокая фиолетово-неоновая палитра */
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #050508; color: #e2e8f0; overflow-x: hidden; min-height: 100vh;
    }
    .bg-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #120b24 0%, #050508 70%);
      z-index: -1; pointer-events: none;
    }
    .neon-line { position: absolute; width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #8a2be2, transparent); opacity: 0.25; transform: rotate(45deg); animation: drop linear infinite; box-shadow: 0 0 10px #8a2be2; }
    .line-1 { left: 15%; animation-duration: 6s; } .line-2 { left: 45%; animation-duration: 9s; } .line-3 { left: 75%; animation-duration: 7s; } .line-4 { left: 90%; animation-duration: 11s; }
    @keyframes drop { 0% { top: -200px; } 100% { top: 100%; } }
    
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
    
    /* Неоновая Шапка */
    .header {
      background: rgba(19, 13, 33, 0.85); padding: 20px 30px; border-radius: 12px; margin-bottom: 25px;
      border: 1px solid #321963; box-shadow: 0 0 20px rgba(138, 43, 226, 0.25);
    }
    .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px #8a2be2; }
    
    .balance-box { 
      background-color: #050508; padding: 12px 24px; border-radius: 8px; 
      border: 1px solid #8a2be2; font-weight: bold; font-size: 1.2rem; 
      display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    /* Макет сетки */
    .main-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card { background-color: rgba(19, 13, 33, 0.85); padding: 25px; border-radius: 12px; border: 1px solid #231245; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    
    /* Карточка кейса */
    .case-card-huge { text-align: center; width: 100%; }
    .weapon-preview-container { width: 100%; height: 110px; margin: 15px auto; display: flex; align-items: center; justify-content: center; }
    .weapon-svg { width: 260px; height: auto; display: block; animation: float 3s infinite ease-in-out; filter: drop-shadow(0 0 10px rgba(138,43,226,0.6)); }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    .price-tag { font-size: 1.7rem; color: #c084fc; font-weight: bold; margin: 15px 0; text-shadow: 0 0 10px rgba(192,132,252,0.4); }

    /* Витрина содержимого */
    .case-contains-title { font-size: 1.2rem; font-weight: bold; margin-top: 35px; margin-bottom: 15px; text-align: left; border-bottom: 1px solid #231245; padding-bottom: 8px; color: #a78bfa; }
    .contains-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .contains-item { background: #050508; border: 1px solid #231245; border-radius: 8px; padding: 12px 6px; font-size: 0.75rem; text-align: center; font-weight: bold; border-bottom: 4px solid #fff; }
    .contains-item svg { width: 100px; height: auto; margin-bottom: 8px; }

    /* 🎬 ГОРИЗОНТАЛЬНАЯ РУЛЕТКА В СТИЛЕ CS */
    .roulette-container {
      position: relative; width: 100%; background: #050508; border: 2px solid #8a2be2; border-radius: 12px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 145px; box-shadow: 0 0 25px rgba(138, 43, 226, 0.4) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #c084fc; z-index: 10; box-shadow: 0 0 15px #8a2be2; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 140px; height: 100%; background: linear-gradient(to right, #050508, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 140px; height: 100%; background: linear-gradient(to left, #050508, transparent); z-index: 5; }
    .roulette-wrapper { display: flex; width: max-content; padding: 12px 0; transform: translateX(0px); }
    
    .roulette-item {
      width: 170px; height: 115px; background: linear-gradient(to bottom, #130d21, #050508); border: 1px solid #231245; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item svg { width: 110px; height: auto; margin-bottom: 8px; }
    .roulette-item span { font-size: 0.72rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

    /* Поп-ап решения */
    .drop-action-popup {
      background: #050508; border: 2px solid #8a2be2; border-radius: 12px; padding: 25px;
      text-align: center; margin: 0 auto 25px auto; max-width: 450px; display: none;
      box-shadow: 0 0 35px rgba(138, 43, 226, 0.6); animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupShow { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn-sell { background: #d9534f !important; color: #fff !important; }
    .btn-sell:hover { box-shadow: 0 0 15px rgba(217,83,79,0.5); }

    /* Инвентарь */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px; max-height: 320px; overflow-y: auto; }
    .inv-card {
      background: #050508; border: 2px solid #231245; border-radius: 10px; padding: 12px 8px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card svg { width: 100px; height: auto; margin: 5px auto; }
    .inv-card .sell-price { color: #f39c12; font-weight: bold; font-size: 0.9rem; margin: 6px 0; }

    /* Лидерборд */
    .leaderboard-list { list-style: none; padding: 0; margin: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #231245; font-size: 0.95rem; }
    .leaderboard-item.top-1 { color: #c084fc; font-weight: bold; text-shadow: 0 0 5px #8a2be2; }

    .btn-primary { background: linear-gradient(to bottom, #8a2be2, #4a148c) !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 0 15px rgba(138,43,226,0.3); transition: all 0.2s; }
    .btn-primary:hover { background: linear-gradient(to bottom, #9d4edd, #5a189a) !important; box-shadow: 0 0 25px rgba(138,43,226,0.6); }
    .btn-primary:disabled { background: #1a1525 !important; color: #444 !important; cursor: not-allowed; box-shadow: none; border: 1px solid #221a35; }
  </style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="bg-lines"><div class="neon-line line-1"></div><div class="neon-line line-2"></div><div class="neon-line line-3"></div><div class="neon-line line-4"></div></div>

<!-- АВТОНОМНЫЙ ВЕКТОРНЫЙ ШАБЛОН MK14 -->

<div class="container">
  <header class="header" style="display: flex; justify-content: space-between; align-items: center;">
    <div class="logo-area"><h1 class="logo-title">METROUP</h1></div>
    <div class="balance-box">
      <span>Баланс:</span><span id="balance-val" style="color: #c084fc;">500</span><span style="color: #c084fc;">💰</span>

  <!-- ОКНО ДРОПА -->
  <div class="drop-action-popup" id="popup-box">
    <h3 style="margin-top:0; color:#fff;">🎉 ПРЕДМЕТ ПОЛУЧЕН:</h3>
    <div id="popup-item-name" style="font-size:1.6rem; font-weight:bold; margin:15px 0;"></div>
    <div class="popup-buttons">
      <button class="btn-primary" onclick="closePopupAndKeep()">🎒 В инвентарь</button>
      <button class="btn-primary btn-sell" id="popup-sell-btn">💰 Продать скин</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="left-column">
      <div class="card">
        <div class="case-card-huge">
          <div class="weapon-preview-container">
