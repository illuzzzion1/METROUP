<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP - Кейсы и Награды</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #050508 !important; color: #e2e8f0 !important;
      position: relative; overflow-x: hidden; min-height: 100vh;
    }
    .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .neon-line { position: absolute; width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2, 0 0 5px #fff; opacity: 0.3; transform: rotate(45deg); animation: drop linear infinite; }
    .line-1 { left: 15%; animation-duration: 6s; } .line-2 { left: 45%; animation-duration: 9s; } .line-3 { left: 75%; animation-duration: 7s; } .line-4 { left: 90%; animation-duration: 11s; }
    @keyframes drop { 0% { top: -200px; } 100% { top: 100%; } }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    /* Шапка сайта */
    .header {
      padding: 20px 30px; background: rgba(13, 13, 20, 0.85) !important; border-radius: 16px; margin-bottom: 25px;
      border: 1px solid #1f1235 !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.15) !important;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
      backdrop-filter: blur(5px);
    }
    .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff !important; text-shadow: 0 0 15px rgba(138, 43, 226, 0.8); cursor: pointer; }
    
    /* Меню навигации */
    .nav-tabs { display: flex; gap: 10px; }
    .nav-btn { background: #0d0d14; border: 1px solid #1f1235; color: #a78bfa; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: #8a2be2; color: #fff; box-shadow: 0 0 15px rgba(138, 43, 226, 0.5); border-color: #a78bfa; }

    .balance-box { 
      background-color: #050508; padding: 12px 24px; border-radius: 10px; 
      border: 1px solid #8a2be2; font-weight: bold; font-size: 1.2rem; 
      display: flex; align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    /* Секции (вкладки) */
    .page-section { display: none; }
    .page-section.active { display: block; }

    .card { background-color: rgba(13, 13, 20, 0.85) !important; padding: 25px; border-radius: 16px; border: 1px solid #1f1235 !important; margin-bottom: 20px; }
    
    /* СЕТКА ГЛАВНОГО МЕНЮ (ВЫБОР КЕЙСОВ) */
    .menu-cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 15px; }
    .case-menu-card { background: #0d0d14; border: 1px solid #1f1235; border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .case-menu-card:hover { transform: translateY(-4px); border-color: #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.3); }
    .case-menu-card i { font-size: 55px; color: #8a2be2; margin-bottom: 15px; display: block; }

    /* ЭКРАН ОТКРЫТИЯ КЕЙСА */
    .case-open-box { text-align: center; max-width: 500px; margin: 0 auto; }
    .case-preview-svg { width: 100%; max-width: 300px; height: auto; margin: 15px 0; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
    .price-tag { font-size: 1.6rem; color: #f39c12; font-weight: bold; margin-bottom: 20px; }

    /* 🎬 ГОРИЗОНТАЛЬНАЯ РУЛЕТКА В СТИЛЕ CS */
    .roulette-container {
      position: relative; width: 100%; background: #0b0818;
      border: 3px solid #8a2be2; border-radius: 14px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 150px;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.4) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #f1c40f; z-index: 10; box-shadow: 0 0 15px #f1c40f; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 120px; height: 100%; background: linear-gradient(to right, #0b0818, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 120px; height: 100%; background: linear-gradient(to left, #0b0818, transparent); z-index: 5; }
    .roulette-wrapper { display: flex; width: max-content; padding: 15px 0; }
    .roulette-item {
      width: 170px; height: 120px; background: linear-gradient(to bottom, #110d24, #080612); border: 1px solid #23184a; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item svg { width: 125px; height: auto; margin-bottom: 5px; }
    .roulette-item span { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    /* Окно быстрого решения (Продать/Забрать) */
    .drop-action-popup {
      background: #0d0d14; border: 2px solid #8a2be2; border-radius: 12px; padding: 20px;
      text-align: center; margin: 20px auto; max-width: 450px; display: none;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
    }
    .popup-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .btn-sell { background-color: #e74c3c !important; color: #fff !important; }
    .btn-sell:hover { background-color: #c0392b !important; box-shadow: 0 0 15px rgba(231,76,60,0.5); }

    /* Инвентарь и склад */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 15px; }
    .inv-card {
      background: #0d0d14; border: 2px solid #1f1235; border-radius: 10px; padding: 15px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card svg { width: 110px; height: auto; margin: 10px auto; }
    .inv-card .sell-price { color: #f39c12; font-weight: bold; font-size: 0.9rem; margin: 8px 0; }

    .leaderboard-list { list-style: none; padding: 0; margin: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #1f1235; font-size: 1rem; }
    .leaderboard-item.top-1 { color: #f1c40f; font-weight: bold; }

    .btn-primary { background-color: #8a2be2 !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; transition: background-color 0.2s; }
    .btn-primary:hover { background-color: #9d4edd !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8) !important; }
    .btn-primary:disabled { background-color: #332255 !important; color: #888 !important; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<div class="bg-lines"><div class="neon-line line-1"></div><div class="neon-line line-2"></div><div class="neon-line line-3"></div><div class="neon-line line-4"></div></div>

<!-- СКРЫТЫЕ 3D ШАБЛОНЫ MK14 (ПОЛНЫЙ РАЗМЕР) -->
<svg style="display: none;">
  <g id="mk14-gun-model">
    <path d="M 5 25 L 50 25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="5" y="23" width="6" height="4" fill="currentColor"/>
    <path d="M 12 23 L 14 16 L 18 23 Z" fill="currentColor"/>
    <path d="M 22 25 L 20 38 L 16 38 M 22 25 L 24 38 L 28 38" stroke="currentColor" stroke-width="1.8" fill="none"/>
    <rect x="40" y="20" width="65" height="9" fill="#131317" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 105 17 L 155 17 L 151 31 L 105 31 Z" fill="#18181f" stroke="currentColor" stroke-width="2"/>
    <path d="M 125 17 L 128 11 L 135 11" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 147 30 L 137 48 C 135 51, 143 53, 145 50 L 154 30 Z" fill="#101014" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 115 31 L 110 52 C 109 54, 121 55, 123 52 L 127 31 Z" fill="#1a1a22" stroke="currentColor" stroke-width="1.8"/>
    <path d="M 132 31 C 132 37, 140 37, 140 31" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <path d="M 153 23 L 185 23 L 185 17 L 195 17 L 195 41 L 185 42 L 185 31 L 153 31" stroke="currentColor" stroke-width="2" fill="none"/>
  </g>
</svg>

<div class="container">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ И НАВИГАЦИЯ -->
  <header class="header">
    <h1 class="logo-title" onclick="switchSection('menu')">METROUP</h1>
    <div class="nav-tabs">
      <button class="nav-btn active" id="btn-menu" onclick="switchSection('menu')"><i class="fas fa-th-large"></i> Кейсы</button>
      <button class="nav-btn" id="btn-inv" onclick="switchSection('inventory')"><i class="fas fa-backpack"></i> Инвентарь</button>
      <button class="nav-btn" id="btn-top" onclick="switchSection('leaderboard')"><i class="fas fa-trophy"></i> Топ Лидеров</button>
    </div>
    <div class="balance-box">
      <span>Баланс:</span>
      <span id="balance-val" style="color: #f39c12;">500</span>
      <span style="color: #f39c12;">💰</span>
    </div>
  </header>

  <!-- ЛЕНТА РУЛЕТКИ (ПОЯВЛЯЕТСЯ ТОЛЬКО ПРИ КРУТИЛКЕ И СКРЫВАЕТ ДРУГОЕ) -->
  <div class="roulette-container" id="roulette-box">
    <div class="roulette-pointer"></div>
    <div class="roulette-wrapper" id="roulette-roll"></div>
  </div>

  <!-- ОКНО РЕШЕНИЯ: ПРОДАТЬ ИЛИ ОСТАВИТЬ -->
  <div class="drop-action-popup" id="popup-box">
    <h3 style="margin-top:0;">🎉 Поздравляем! Выпал предмет:</h3>
    <div id="popup-item-name" style="font-size:1.5rem; font-weight:bold; margin:15px 0;"></div>
