<!DOCTYPE html>
<html lang="ru-RU">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>METROUP :: У нас выигрывают крутые скины MK14</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    /* Оригинальная палитра Case-Battle */
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #171c25; color: #e2e8f0;
      overflow-x: hidden; min-height: 100vh;
    }
    .bg-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, #1e2633 0%, #171c25 70%);
      z-index: -1; pointer-events: none;
    }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
    
    /* Фирменный Header Case-Battle */
    header .wrapper {
      padding: 15px 25px; background: #1b222e; border-radius: 12px; margin-bottom: 25px;
      border: 1px solid #232c3d; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { width: 35px; height: 35px; fill: url(#icon-orange-gt); }
    .logo-title { margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-shadow: 0 0 10px rgba(246,164,90,0.3); }
    
    /* Вкладки навигации */
    .nav-tabs { display: flex; gap: 8px; }
    .nav-btn { background: #131821; border: 1px solid #232c3d; color: #f6a45a; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .nav-btn:hover, .nav-btn.active { background: url(#icon-orange-gt); background-color: #b0681e; color: #fff; border-color: #f6a45a; box-shadow: 0 0 15px rgba(246,164,90,0.2); }

    /* Блок кошелька */
    .balance-box { 
      background-color: #131821; padding: 10px 20px; border-radius: 8px; 
      border: 1px solid #b0681e; font-weight: bold; font-size: 1.1rem; 
      display: flex; align-items: center; gap: 8px; box-shadow: 0 0 10px rgba(176,104,30,0.2);
    }
    .coin-icon { color: #f6a45a; }

    /* Переключение разделов */
    .page-section { display: none; }
    .page-section.active { display: block; }
    .card { background-color: #1b222e; padding: 25px; border-radius: 12px; border: 1px solid #232c3d; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    /* Сетка кейсов */
    .menu-cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 15px; }
    .case-menu-card { background: #131821; border: 1px solid #232c3d; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .case-menu-card:hover { transform: translateY(-3px); border-color: #f6a45a; box-shadow: 0 0 20px rgba(246,164,90,0.2); }
    .case-menu-card svg.case-svg { width: 60px; height: 60px; fill: url(#icon-case-gt); margin-bottom: 12px; }

    /* Витрина кейса */
    .case-open-box { text-align: center; max-width: 550px; margin: 0 auto; }
    .weapon-preview-container { width: 100%; height: 130px; margin: 15px auto; display: flex; align-items: center; justify-content: center; }
    .weapon-preview-img { width: 100%; max-width: 260px; height: auto; display: block; animation: float 3s infinite ease-in-out; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    .price-tag { font-size: 1.6rem; color: #f6a45a; font-weight: bold; margin-bottom: 25px; text-shadow: 0 0 10px rgba(246,164,90,0.3); }

    /* Начинка кейса снизу */
    .case-contains-title { font-size: 1.1rem; font-weight: bold; margin-top: 30px; margin-bottom: 15px; text-align: left; border-bottom: 1px solid #232c3d; padding-bottom: 8px; color: #f6a45a; }
    .contains-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .contains-item { background: #131821; border: 1px solid #232c3d; border-radius: 8px; padding: 12px 8px; font-size: 0.75rem; text-align: center; font-weight: bold; border-bottom: 4px solid #fff; }
    .contains-item img { width: 95px; height: auto; max-height: 45px; object-fit: contain; margin-bottom: 8px; }

    /* 🎬 ГОРИЗОНТАЛЬНАЯ РУЛЕТКА В СТИЛЕ CS БЕЗ БАГОВ */
    .roulette-container {
      position: relative; width: 100%; background: #0e1219;
      border: 2px solid #b0681e; border-radius: 12px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 145px;
      box-shadow: 0 0 25px rgba(176,104,30,0.3) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #f6a45a; z-index: 10; box-shadow: 0 0 15px #f6a45a; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 130px; height: 100%; background: linear-gradient(to right, #0e1219, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 130px; height: 100%; background: linear-gradient(to left, #0e1219, transparent); z-index: 5; }
    .roulette-wrapper { display: flex; width: max-content; padding: 12px 0; }
    .roulette-item {
      width: 170px; height: 115px; background: linear-gradient(to bottom, #171c25, #11151c); border: 1px solid #232c3d; margin: 0 4px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item img { width: 115px; height: auto; max-height: 50px; object-fit: contain; margin-bottom: 8px; }
    .roulette-item span { font-size: 0.72rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

    /* Поп-ап решения дропа */
    .drop-action-popup {
      background: #131821; border: 2px solid #f6a45a; border-radius: 12px; padding: 25px;
      text-align: center; margin: 0 auto 25px auto; max-width: 450px; display: none;
      box-shadow: 0 0 30px rgba(176,104,30,0.4);
      animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupShow { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn-sell { background-color: #d9534f !important; color: #fff !important; }
    .btn-sell:hover { background-color: #c9302c !important; box-shadow: 0 0 15px rgba(217,83,79,0.4); }

    /* Инвентарь и склад */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 15px; }
    .inv-card {
      background: #131821; border: 2px solid #232c3d; border-radius: 10px; padding: 15px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card img { width: 110px; height: auto; max-height: 50px; object-fit: contain; margin: 10px auto; }
    .inv-card .sell-price { color: #f6a45a; font-weight: bold; font-size: 0.95rem; margin: 8px 0; }

    .leaderboard-list { list-style: none; padding: 0; margin: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #232c3d; font-size: 1rem; }
    .leaderboard-item.top-1 { color: #f6a45a; font-weight: bold; text-shadow: 0 0 8px rgba(246,164,90,0.3); }

    .btn-primary { background: linear-gradient(to bottom, #f6a45a, #b0681e) !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 3px 10px rgba(0,0,0,0.3); transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { background: #2c3545 !important; color: #666 !important; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
