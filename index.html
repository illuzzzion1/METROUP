<!-- ПОДКЛЮЧЕНИЕ СТИЛЕЙ И ИКОНОК -->
<link rel="stylesheet" href="https://cloudflare.com">

<style>
  body {
    margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
    background-color: #050508 !important; color: #e2e8f0 !important;
    position: relative; overflow-x: hidden; min-height: 100vh;
  }
  .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .neon-line { position: absolute; width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2, 0 0 5px #fff; opacity: 0.3; transform: rotate(45deg); animation: drop linear infinite; }
  .line-1 { left: 15%; animation-duration: 6s; } .line-2 { left: 45%; animation-duration: 9s; } .line-3 { left: 75%; animation-duration: 7s; } .line-4 { left: 90%; animation-duration: 11s; }
  @keyframes drop { 0% { top: -200px; } 100% { top: 100%; } }
  
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  
  .header {
    padding: 20px 30px; background: rgba(13, 13, 20, 0.85) !important; border-radius: 16px; margin-bottom: 30px;
    border: 1px solid #1f1235 !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.15) !important;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    backdrop-filter: blur(5px);
  }
  .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff !important; text-shadow: 0 0 15px rgba(138, 43, 226, 0.8); }
  
  .balance-box { 
    background-color: #050508; padding: 12px 24px; border-radius: 10px; 
    border: 1px solid #8a2be2; font-weight: bold; font-size: 1.2rem; 
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
  }
  .coin-icon { color: #f39c12; }

  .main-grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
  
  .card { background-color: rgba(13, 13, 20, 0.85) !important; padding: 25px; border-radius: 16px; border: 1px solid #1f1235 !important; margin-bottom: 20px; }
  
  /* КЕЙС С ПОЛНОЙ МОДЕЛЬЮ MK14 */
  .case-zone-center { display: flex; justify-content: center; margin: 20px 0; }
  .case-card-huge { 
    background: linear-gradient(135deg, #100a26, #05030f); 
    border: 2px solid #8a2be2; box-shadow: 0 0 30px rgba(138, 43, 226, 0.5); 
    border-radius: 16px; padding: 30px; text-align: center; max-width: 420px; width: 100%; 
  }
  
  .weapon-preview-container {
    width: 100%; max-width: 320px; height: 140px; margin: 15px auto;
    display: flex; align-items: center; justify-content: center;
  }
  .weapon-preview-img {
    width: 100%; height: 100%; display: block;
    animation: float 3s infinite ease-in-out;
  }
  @keyframes float {
    0% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.4)); }
    50% { transform: translateY(-10px) rotate(-1deg); filter: drop-shadow(0 0 25px rgba(138, 43, 226, 0.8)); }
    100% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.4)); }
  }
  .case-price-tag { font-size: 1.6rem; color: #f39c12; font-weight: bold; margin: 15px 0; text-shadow: 0 0 10px rgba(243,156,18,0.5); }

  /* ГОРИЗОНТАЛЬНАЯ РУЛЕТКА CS:GO / CS2 */
  .roulette-container {
    position: relative; width: 100%; background: #0b0818;
    border: 2px solid #4c1d95; border-radius: 12px;
    margin-bottom: 25px; overflow: hidden; display: none;
    box-shadow: 0 0 20px rgba(138, 43, 226, 0.3) inset;
  }
  /* Центральный маркер (прицел рулетки) */
  .roulette-pointer {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 4px; height: 100%; background-color: #f1c40f;
    z-index: 10; box-shadow: 0 0 10px #f1c40f;
  }
  .roulette-wrapper {
    display: flex; width: max-content; padding: 15px 0;
    transition: transform 4s cubic-bezier(0.1, 0.6, 0.1, 1); /* Плавное торможение как в CS */
    transform: translateX(0px);
  }
  .roulette-item {
    width: 150px; height: 120px; background: rgba(13, 13, 20, 0.9);
    border: 1px solid #1f1235; margin: 0 5px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0; box-sizing: border-box; text-align: center; padding: 5px;
    border-bottom: 4px solid #fff;
  }
  .roulette-item svg { width: 110px; height: auto; margin-bottom: 5px; }
  .roulette-item span { font-size: 0.75rem; font-weight: bold; line-height: 1.1; }

  /* Показ финального выигрыша */
  .win-announce {
    text-align: center; font-size: 1.6rem; font-weight: bold;
    margin: 15px 0; display: none; animation: winGlow 1s ease-out;
  }
  @keyframes winGlow { 0% { opacity:0; transform: scale(0.9); } 100% { opacity:1; transform: scale(1); } }

  /* Склад оружия */
  .inventory-box { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; max-height: 350px; overflow-y: auto; }
  .inv-item { 
    background: #0d0d14; border: 2px solid #2d1b4e; padding: 12px 8px; border-radius: 8px; 
    font-size: 0.8rem; font-weight: bold; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }
  .leaderboard-list { list-style: none; padding: 0; margin: 15px 0 0 0; }
  .leaderboard-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #1f1235; font-size: 0.95rem; }
  .leaderboard-item:last-child { border-bottom: none; }
  .leaderboard-item.top-1 { color: #f1c40f; font-weight: bold; }

  .btn-primary { background-color: #8a2be2 !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
  .btn-primary:hover { background-color: #9d4edd !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8) !important; }
  .social-links { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
  .btn-secondary { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; color: #fff; }
  .btn-youtube { background-color: #ff0000; } .btn-telegram { background-color: #24a1de; }
</style>

<div class="bg-lines"><div class="neon-line line-1"></div><div class="neon-line line-2"></div><div class="neon-line line-3"></div><div class="neon-line line-4"></div></div>

<div class="container">
  <header class="header">
    <h1 class="logo-title">METROUP</h1>
    <div class="balance-box">
      <span>Ваш Баланс:</span>
      <span id="balance-val" style="color: #f39c12;">500</span>
      <i class="fas fa-coins coin-icon"></i>
    </div>
  </header>

  <div class="main-grid">
    <div class="left-column">
      <!-- ГОРИЗОНТАЛЬНЫЙ КЕЙС-БАРАБАН -->
      <div class="roulette-container" id="roulette-box">
        <div class="roulette-pointer"></div>
        <div class="roulette-wrapper" id="roulette-roll"></div>
      </div>

      <!-- ТЕКСТ ПОБЕДЫ -->
      <div class="win-announce" id="win-text"></div>

      <div class="card">
        <h2>🧰 Контейнер Снабжения MK14</h2>
