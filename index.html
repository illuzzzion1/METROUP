<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METROUP - Идеальная Рулетка</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #050508 !important; color: #e2e8f0 !important;
      position: relative; overflow-x: hidden; min-height: 100vh;
    }
    .bg-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .neon-line { position: absolute; width: 2px; height: 150px; background: linear-gradient(to bottom, transparent, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2, 0 0 5px #fff; opacity: 0.3; transform: rotate(45deg); animation: drop linear infinite; }
    .line-1 { left: 15%; animation-duration: 6s; } .line-2 { left: 45%; animation-duration: 9s; } .line-3 { left: 75%; animation-duration: 7s; } .line-4 { left: 90%; animation-duration: 11s; }
    @keyframes drop { 0% { top: -200px; } 100% { top: 100%; } }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    .header {
      padding: 20px 30px; background: rgba(13, 13, 20, 0.85) !important; border-radius: 16px; margin-bottom: 25px;
      border: 1px solid #1f1235 !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.15) !important;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; backdrop-filter: blur(5px);
    }
    .logo-title { margin: 0; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff !important; text-shadow: 0 0 15px rgba(138, 43, 226, 0.8); cursor: pointer; }
    
    .nav-tabs { display: flex; gap: 10px; }
    .nav-btn { background: #0d0d14; border: 1px solid #1f1235; color: #a78bfa; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: #8a2be2; color: #fff; box-shadow: 0 0 15px rgba(138, 43, 226, 0.5); border-color: #a78bfa; }

    .balance-box { 
      background-color: #050508; padding: 12px 24px; border-radius: 10px; border: 1px solid #8a2be2; 
      font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
    }

    .page-section { display: none; }
    .page-section.active { display: block; }
    .card { background-color: rgba(13, 13, 20, 0.85) !important; padding: 25px; border-radius: 16px; border: 1px solid #1f1235 !important; margin-bottom: 20px; }
    
    .menu-cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 15px; }
    .case-menu-card { background: #0d0d14; border: 1px solid #1f1235; border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .case-menu-card:hover { transform: translateY(-4px); border-color: #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.3); }
    .case-menu-card i { font-size: 55px; color: #8a2be2; margin-bottom: 15px; display: block; }

    /* ЭКРАН ОТКРЫТИЯ КЕЙСА */
    .case-open-box { text-align: center; max-width: 600px; margin: 0 auto; }
    
    /* Красивая 3D-форма винтовки (продвинутый CSS-рисунок) */
    .weapon-preview-container { width: 100%; max-width: 320px; height: 130px; margin: 15px auto; display: flex; align-items: center; justify-content: center; position: relative; }
    .gun-graphic { width: 280px; height: 24px; background: #16161f; border: 2px solid #8a2be2; position: relative; border-radius: 4px; box-shadow: 0 0 15px rgba(138, 43, 226, 0.5); animation: float 3s infinite ease-in-out; }
    .gun-graphic::before { content: ''; position: absolute; left: -30px; top: 8px; width: 30px; height: 4px; background: #8a2be2; } /* ствол */
    .gun-graphic::after { content: ''; position: absolute; right: -20px; top: -4px; width: 20px; height: 30px; background: #1a1a24; border-left: 3px solid #8a2be2; } /* приклад */
    .gun-mag { position: absolute; left: 100px; bottom: -18px; width: 16px; height: 20px; background: #0f0f14; border: 1px solid #8a2be2; transform: skewX(-10deg); }
    .gun-scope { position: absolute; left: 110px; top: -14px; width: 30px; height: 12px; background: #252533; border: 1px solid #8a2be2; border-radius: 2px; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

    .price-tag { font-size: 1.6rem; color: #f39c12; font-weight: bold; margin-bottom: 20px; }

    /* 🎬 НАСТОЯЩАЯ РУЛЕТКА CS:GO С ФИЗИКОЙ ИНЕРЦИИ */
    .roulette-container {
      position: relative; width: 100%; background: #070510;
      border: 3px solid #8a2be2; border-radius: 14px;
      margin-bottom: 25px; overflow: hidden; display: none; height: 145px;
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.5) inset;
    }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background-color: #f1c40f; z-index: 10; box-shadow: 0 0 15px #f1c40f; }
    .roulette-container::before { content: ''; position: absolute; top: 0; left: 0; width: 140px; height: 100%; background: linear-gradient(to right, #070510, transparent); z-index: 5; }
    .roulette-container::after { content: ''; position: absolute; top: 0; right: 0; width: 140px; height: 100%; background: linear-gradient(to left, #070510, transparent); z-index: 5; }
    
    .roulette-wrapper { 
      display: flex; width: max-content; padding: 10px 0;
      transform: translateX(0px);
    }
    .roulette-item {
      width: 150px; height: 120px; background: linear-gradient(to bottom, #110d24, #080612); border: 1px solid #1f1235; margin: 0 5px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; padding: 5px; border-bottom: 5px solid #fff;
    }
    .roulette-item-gun { width: 100px; height: 12px; background: currentColor; position: relative; border-radius: 2px; margin-bottom: 15px; margin-top: 10px; }
    .roulette-item-gun::before { content: ''; position: absolute; left: -15px; top: 4px; width: 15px; height: 2px; background: currentColor; }
    .roulette-item-gun::after { content: ''; position: absolute; right: -10px; top: -2px; width: 100px; height: 100%; max-width: 10px; height: 16px; background: #1a1a24; }
    .roulette-item span { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

    /* Окно выпавшего дропа */
    .drop-action-popup {
      background: #0d0d14; border: 2px solid #8a2be2; border-radius: 12px; padding: 25px;
      text-align: center; margin: 20px auto; max-width: 450px; display: none;
      box-shadow: 0 0 35px rgba(138, 43, 226, 0.5);
      animation: popupShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupShow { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .popup-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .btn-sell { background-color: #e74c3c !important; color: #fff !important; }
    .btn-sell:hover { background-color: #c0392b !important; box-shadow: 0 0 15px rgba(231,76,60,0.5); }

    /* Инвентарь */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 15px; }
    .inv-card {
      background: #0d0d14; border: 2px solid #1f1235; border-radius: 10px; padding: 15px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between;
    }
    .inv-card-gun { width: 100px; height: 12px; background: currentColor; position: relative; border-radius: 2px; margin: 20px auto; }
    .inv-card-gun::before { content: ''; position: absolute; left: -15px; top: 4px; width: 15px; height: 2px; background: currentColor; }
    .inv-card .sell-price { color: #f39c12; font-weight: bold; font-size: 0.95rem; margin: 8px 0; }

    .leaderboard-list { list-style: none; padding: 0; margin: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #1f1235; font-size: 1rem; }
    .leaderboard-item.top-1 { color: #f1c40f; font-weight: bold; }

    .btn-primary { background-color: #8a2be2 !important; color: #fff !important; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; transition: background-color 0.2s; box-shadow: 0 0 15px rgba(138,43,226,0.3); }
    .btn-primary:hover { background-color: #9d4edd !important; box-shadow: 0 0 20px rgba(138, 43, 226, 0.8) !important; }
    .btn-primary:disabled { background-color: #332255 !important; color: #888 !important; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<div class="bg-lines"><div class="neon-line line-1"></div><div class="neon-line line-2"></div><div class="neon-line line-3"></div><div class="neon-line line-4"></div></div>

<div class="container">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="header">
    <h1 class="logo-title" onclick="switchSection('menu')">METROUP</h1>
    <div class="nav-tabs">
      <button class="nav-btn active" id="btn-menu" onclick="switchSection('menu')"><i class="fas fa-box-open"></i> Кейсы</button>
      <button class="nav-btn" id="btn-inv" onclick="switchSection('inventory')"><i class="fas fa-backpack"></i> Инвентарь</button>
      <button class="nav-btn" id="btn-top" onclick="switchSection('leaderboard')"><i class="fas fa-trophy"></i> Топ</button>
    </div>
    <div class="balance-box">
      <span>Ваш Баланс:</span>
      <span id="balance-val" style="color: #f39c12;">500</span>
      <span style="color: #f39c12;">💰</span>
    </div>
  </header>
